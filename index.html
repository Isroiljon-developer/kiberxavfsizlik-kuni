<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGOH BO‘LING!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .warning-card {
            background: #1e293b;
            border: 3px solid #ef4444;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
            100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); }
        }
        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }
        h1 {
            color: #ef4444;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 20px;
        }
        .highlight {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        .footer-text {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 25px;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="warning-card">
        <div class="icon">⚠️</div>
        <h1>OGOH BO‘LING!</h1>
        <p>Siz hozir noma'lum <span class="highlight">APK faylni</span> yuklab oldingiz va tizimingiz shartli ravishda buzildi!</p>
        <p>Haqiqiy hayotda bu kabi e'tiborsizlik barcha shaxsiy ma'lumotlaringiz, parollaringiz va bank kartalaringiz o‘g‘irlanishiga olib keladi.</p>
        <div class="footer-text">
            Cyber Security Day — Raqamli Xavfsizlik Demosi
        </div>
    </div>

</body>
</html>
